name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Build
        run: ./gradlew classes
      - name: Test
        run: ./gradlew test
      - name: Package
        run: ./gradlew shadowJar
      - uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar
